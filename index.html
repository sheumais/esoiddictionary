<!doctype html>
<html>
    <head>
        <title>ESO ID Dictionary</title>
        <meta charset="utf-8" />
        <base data-trunk-public-url />
        <link data-trunk rel="copy-dir" href="static/" />
        <link rel="icon" href="static/julianos.png" />
        <style>
            a {text-decoration: none;}
            footer {
                width: 100%;
                background-color: #FAEBD7;
                border-top: 1px solid #c9a97a;
                text-align: center;
                padding-top: 6px;
                font-size: 0.8rem;
                color: #555;
                margin-top: 1em;
            }
            .content {
                min-height: calc(100vh - 4em);
            }

            .loader {
                width: 100px;
                height: 100px;
                background: #000;
                display: inline-block;
                border-radius: 50%;
                box-sizing: border-box;
                position: absolute;
                animation: animloader 1s ease-in infinite;
            }

            @keyframes animloader {
                0% {
                    transform: scale(0);
                    opacity: 1;
                }
                100% {
                    transform: scale(1);
                    opacity: 0;
                }
            } 
        </style>
    </head>
    <body style="background-color: #FAEBD7; color: black; font-family: sans-serif;"></body>
</html>
